  about_title: "More About Me"
  about_description: |
    Chia Network is building a better blockchain and smart transaction platform which is more secure, more sustainable, and more powerful.

    Support is also provided for Chia developers and the enterprise use of Chia through professional services and chia lending.
  about_team_title: "Team"
  about_team_description: |
    Chia Network was founded by the creator of BitTorrent, [Bram Cohen](https://www.linkedin.com/in/cohenbram/). It also includes executive leadership from the former founder and CEO of eMusic.com and Vindicia, [Gene Hoffman](https://www.linkedin.com/in/gehoffman/). The Chia blockchain has an active open source developer community with many contributions to the codebase. Many individuals contribute towards the Chia blockchain in areas which include research, peer reviews, development, testing, documentation, and translation.
